version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      markuplint:
        patterns:
          - "markuplint"
          - "@markuplint/jsx-parser"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "vitest"
      testing-library:
        patterns:
          - "@testing-library/dom"
          - "@testing-library/react"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 2

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
